<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>Weather</h1>

    <form id="search-form" class="search-form">
      <input type="text" id="city-input" placeholder="Search for a city..." autocomplete="off" required>
      <button type="submit">Search</button>
      <button type="button" id="locate-btn" title="Use my location">📍</button>
    </form>

    <p id="status" class="status"></p>

    <div id="weather-card" class="weather-card hidden">
      <div class="location">
        <h2 id="city-name"></h2>
        <p id="date-time"></p>
      </div>

      <div class="current">
        <img id="weather-icon" src="" alt="">
        <div class="temp-block">
          <span id="temperature" class="temperature"></span>
          <span id="condition" class="condition"></span>
        </div>
      </div>

      <div class="details">
        <div class="detail">
          <span class="label">Feels like</span>
          <span id="feels-like" class="value"></span>
        </div>
        <div class="detail">
          <span class="label">Humidity</span>
          <span id="humidity" class="value"></span>
        </div>
        <div class="detail">
          <span class="label">Wind</span>
          <span id="wind" class="value"></span>
        </div>
        <div class="detail">
          <span class="label">Precipitation</span>
          <span id="precipitation" class="value"></span>
        </div>
      </div>

      <div class="forecast" id="forecast"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
